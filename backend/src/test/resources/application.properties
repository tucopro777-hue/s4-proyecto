spring.application.name=finanzas-backend-test

# Pruebas: H2 en memoria en modo PostgreSQL. Flyway aplica la misma migración que en producción,
# así que las pruebas también validan el esquema.
spring.datasource.url=jdbc:h2:mem:finanzas-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

jwt.secret=pruebas-clave-secreta-de-al-menos-32-caracteres-para-hs256
jwt.expiration-ms=86400000
