spring.application.name=finanzas-backend
server.port=8080

# Base de datos H2 en memoria (desarrollo)
spring.datasource.url=jdbc:h2:mem:finanzas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: la clave debe tener al menos 32 caracteres (256 bits) para HS256
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-de-al-menos-32-caracteres}
jwt.expiration-ms=86400000
