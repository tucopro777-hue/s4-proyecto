spring.application.name=finanzas-backend
server.port=8080

# Base de datos PostgreSQL local. Las credenciales se pueden sobrescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finanzas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea y versiona Flyway; Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

# JWT: la clave debe tener al menos 32 caracteres (256 bits) para HS256
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-de-al-menos-32-caracteres}
jwt.expiration-ms=86400000
