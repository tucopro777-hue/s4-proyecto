spring.application.name=finanzas-backend
server.port=8080


server.error.include-message=always


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/finanzas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false


app.demo.enabled=${APP_DEMO_ENABLED:true}


jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-de-al-menos-32-caracteres}
jwt.expiration-ms=86400000


# Bloqueo de login: tras N fallos seguidos la cuenta queda bloqueada durante X minutos
app.seguridad.max-intentos-login=3
app.seguridad.minutos-bloqueo=15
